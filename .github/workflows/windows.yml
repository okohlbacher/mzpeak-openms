name: windows

# MSVC build of the library, separate from test.yml because that one is nix
# and nix does not run on Windows.
#
# Every dependency comes from conda-forge's win-64 channel: it is what OpenMS's
# own Windows CI uses for Arrow, and its packages ship the pkg-config files
# meson looks for (arrow.pc, parquet.pc, libzip.pc). Boost has none; meson
# finds it through BOOST_ROOT.
#
# Only the static library is built here -- see meson.build.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          activate-environment: mzpeak
          python-version: '3.12'
          use-mamba: true

      # The only login-shell step. A login shell sources Git for Windows'
      # /etc/profile, which puts /usr/bin -- and its GNU link.exe -- ahead of
      # MSVC's linker; meson then refuses to configure. So the env is activated
      # here once, and its tool and DLL directories go on GITHUB_PATH for the
      # plain-bash steps below, where MSVC's link.exe stays in front.
      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -y -c conda-forge 'libarrow>=21' libparquet libzip libboost-devel 'meson>=1.3' ninja pkg-config
          ENVROOT=$(conda info --json | python -c "import json,sys;print(json.load(sys.stdin)['active_prefix'])" | sed 's|\\|/|g')
          echo "PREFIX=$ENVROOT/Library" >> "$GITHUB_ENV"
          for d in "$ENVROOT/Library/bin" "$ENVROOT/Scripts" "$ENVROOT"; do echo "$d" >> "$GITHUB_PATH"; done

      - name: Configure
        shell: bash
        env:
          CC: cl
          CXX: cl
        run: |
          which cl link meson ninja pkg-config
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          export BOOST_ROOT="$PREFIX"
          meson setup build --buildtype=release -Dtools=false

      - name: Build
        shell: bash
        # -k 0: keep going, so one run reports every failing TU rather than the first.
        run: ninja -C build -k 0

      - name: Test
        shell: bash
        run: meson test -C build --print-errorlogs

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meson-logs
          path: build/meson-logs/
